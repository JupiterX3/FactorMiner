{% extends "factor_mining.html" %}

{% block title %}时序挖掘 - {{ config.title }}{% endblock %}

{% block extra_css %}
<!-- 因子挖掘专用样式 -->

<style>
/* 仅保留时序挖掘：隐藏模式切换与截面配置 */

#csAlgoInfo { display: none !important; }
#modeCrossSectional, label[for="modeCrossSectional"], #modeRL, label[for="modeRL"] { display: none !important; }

{% block extra_js %}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
window.__MINING_PAGE_PRESET__ = { mode: 'standard' };
</script>
<!-- 自定义因子挖掘JavaScript -->
<script src="{{ url_for('static', filename='js/factor_mining.js') }}"></script>

{% endblock %}
