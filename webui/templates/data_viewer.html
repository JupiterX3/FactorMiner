{% extends "base.html" %}

{% block title %}数据查看 - {{ config.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>📁 数据查看</h2>
        <p class="text-muted">查看本地存储的行情数据</p>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5>📊 本地数据</h5>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">筛选交易所</label>
                        <select class="form-select" id="filterExchange">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">筛选交易对</label>
                        <select class="form-select" id="filterSymbol">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">筛选时间框架</label>
                        <select class="form-select" id="filterTimeframe">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">筛选数据类型</label>
                        <select class="form-select" id="filterDataType">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-outline-primary w-100" onclick="refreshData()">
                            🔄 刷新
                        </button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>交易所</th>
                                <th>交易对</th>
                                <th>时间框架</th>
                                <th>数据类型</th>
                                <th>数据范围</th>
                                <th>数据点数</th>
                                <th>文件大小</th>
                                <th>最后修改</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                            <!-- 数据将在这里动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 数据查看模态框 -->
<div class="modal fade" id="dataViewModal" tabindex="-1" aria-labelledby="dataViewModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-xl-down" style="max-width: 95vw; margin: 1rem auto; height: 95vh;">
        <div class="modal-content" style="height: 100%;">
            <div class="modal-header">
                <h5 class="modal-title" id="dataViewModalLabel">📊 数据查看</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="height: calc(100% - 120px); overflow-y: auto;">
                <!-- 标签页导航 -->
                <ul class="nav nav-tabs" id="dataViewTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="kline-tab" data-bs-toggle="tab" data-bs-target="#kline-content" type="button" role="tab">
                            📈 K线图
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="data-tab" data-bs-toggle="tab" data-bs-target="#data-content" type="button" role="tab">
                            📋 行情数据
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="meta-tab" data-bs-toggle="tab" data-bs-target="#meta-content" type="button" role="tab">
                            ℹ️ Meta信息
                        </button>
                    </li>
                </ul>
                
                <!-- 标签页内容 -->
                <div class="tab-content" id="dataViewTabContent">
                    <!-- K线图标签页 -->
                    <div class="tab-pane fade show active" id="kline-content" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <div class="row align-items-center">
                                            <div class="col-md-6">
                                                <h6 class="mb-0">📈 K线图</h6>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="d-flex gap-2 justify-content-end">
                                                    <select class="form-select form-select-sm" id="factorSelect" style="max-width: 200px;">
                                                        <option value="">选择因子...</option>
                                                    </select>
                                                    <button class="btn btn-sm btn-outline-primary" onclick="addFactor()">
                                                        ➕ 添加因子
                                                    </button>
                                                    <button class="btn btn-sm btn-outline-secondary" onclick="clearFactors()">
                                                        🗑️ 清空因子
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-body p-3" style="min-height: 560px;">
                                        <div id="klineChart" style="width: 100% !important; height: 540px; max-height: 540px; overflow: hidden; border: 1px solid #e9ecef; border-radius: 4px; min-width: 100%;"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 已选因子列表 -->
                        <div class="row mt-2" id="selectedFactorsRow" style="display: none;">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-body p-2">
                                        <div class="d-flex flex-wrap gap-2" id="selectedFactorsList">
                                            <!-- 已选因子标签将在这里显示 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 行情数据标签页 -->
                    <div class="tab-pane fade" id="data-content" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h6>行情数据表格</h6>
                                    <div>
                                        <button class="btn btn-sm btn-outline-primary" onclick="exportData('csv')">
                                            📥 导出CSV
                                        </button>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-sm table-striped" id="ohlcvDataTable">
                                        <thead>
                                            <tr>
                                                <th>时间</th>
                                                <th>开盘价</th>
                                                <th>最高价</th>
                                                <th>最低价</th>
                                                <th>收盘价</th>
                                                <th>成交量</th>
                                            </tr>
                                        </thead>
                                        <tbody id="dataTableBody">
                                            <!-- 数据将在这里动态生成 -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Meta信息标签页 -->
                    <div class="tab-pane fade" id="meta-content" role="tabpanel">
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-body">
                                        <div id="metaInfo">
                                            <!-- Meta信息将在这里动态生成 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>


{% endblock %}

{% block extra_js %}
<script src="https://cdn.plot.ly/plotly-latest.min.js" id="plotlyScript" onerror="handlePlotlyError()"></script>

<script>
const DataViewer = {
    state: {
        selectedFactors: [],
        availableFactors: [],
        currentData: null,
        currentOHLCVData: null,
        klineChartEl: null,
        plotlyLoaded: false,
        resizeHandler: null,
        factorCache: {}
    },
    
    init() {
        this.waitForPlotly().then(() => {
            this.loadLocalData();
            this.loadAvailableFactors();
            this.setupFilterListeners();
            this.setupModalCleanup();
        }).catch(err => {
            console.error('Plotly加载失败:', err);
            this.showError('图表库加载失败，部分功能可能不可用');
        });
    },
    
    setupModalCleanup() {
        const modalEl = document.getElementById('dataViewModal');
        if (modalEl) {
            modalEl.addEventListener('hidden.bs.modal', () => {
                this.cleanupModalState();
            });
        }
    },
    
    cleanupModalState() {
        this.state.currentOHLCVData = null;
        this.state.selectedFactors = [];
        this.state.factorCache = {};
        
        if (this.state.klineChartEl && typeof Plotly !== 'undefined') {
            Plotly.purge(this.state.klineChartEl);
        }
        this.state.klineChartEl = null;
        
        if (this.state.resizeHandler) {
            window.removeEventListener('resize', this.state.resizeHandler);
            this.state.resizeHandler = null;
        }
        
        updateSelectedFactorsUI();
        
        const dataTableBody = document.getElementById('dataTableBody');
        if (dataTableBody) dataTableBody.innerHTML = '';
        
        const metaInfo = document.getElementById('metaInfo');
        if (metaInfo) metaInfo.innerHTML = '';
    },
    
    waitForPlotly() {
        return new Promise((resolve, reject) => {
            if (typeof Plotly !== 'undefined') {
                this.state.plotlyLoaded = true;
                resolve();
                return;
            }
            
            const checkInterval = setInterval(() => {
                if (typeof Plotly !== 'undefined') {
                    clearInterval(checkInterval);
                    clearTimeout(timeout);
                    this.state.plotlyLoaded = true;
                    resolve();
                }
            }, 100);
            
            const timeout = setTimeout(() => {
                clearInterval(checkInterval);
                if (typeof Plotly === 'undefined') {
                    reject(new Error('Plotly加载超时'));
                }
            }, 10000);
        });
    },
    
    setupFilterListeners() {
        const filters = ['filterExchange', 'filterSymbol', 'filterTimeframe', 'filterDataType'];
        filters.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', () => {
                    this.updateDependentFilters(id);
                    this.displayData(this.state.currentData || []);
                });
            }
        });
    },
    
    updateDependentFilters(changedFilterId) {
        if (!this.state.currentData) return;
        
        const filterIds = ['filterExchange', 'filterSymbol', 'filterTimeframe', 'filterDataType'];
        const filterKeys = ['exchange', 'symbol', 'timeframe', 'data_type'];
        const changedIndex = filterIds.indexOf(changedFilterId);
        if (changedIndex === -1) return;
        
        const currentFilters = {};
        filterIds.forEach((id, i) => {
            currentFilters[filterKeys[i]] = document.getElementById(id).value;
        });
        
        for (let i = changedIndex + 1; i < filterIds.length; i++) {
            const downstreamId = filterIds[i];
            const downstreamKey = filterKeys[i];
            
            let filteredData = this.state.currentData;
            for (let j = 0; j < i; j++) {
                const val = currentFilters[filterKeys[j]];
                if (val) {
                    filteredData = filteredData.filter(item => {
                        const itemVal = filterKeys[j] === 'data_type' ? (item[filterKeys[j]] || 'unknown') : item[filterKeys[j]];
                        return itemVal === val;
                    });
                }
            }
            
            const uniqueValues = [...new Set(filteredData.map(item => {
                return downstreamKey === 'data_type' ? (item[downstreamKey] || 'unknown') : item[downstreamKey];
            }))].sort();
            
            const select = document.getElementById(downstreamId);
            const prevValue = select.value;
            
            select.innerHTML = '<option value="">全部</option>';
            uniqueValues.forEach(val => {
                const option = document.createElement('option');
                option.value = val;
                option.textContent = downstreamId === 'filterExchange' ? val.toUpperCase() : val;
                select.appendChild(option);
            });
            
            if (uniqueValues.includes(prevValue)) {
                select.value = prevValue;
            } else {
                select.value = '';
                currentFilters[downstreamKey] = '';
            }
        }
    },
    
    showError(message) {
        const alertDiv = document.createElement('div');
        alertDiv.className = 'alert alert-warning alert-dismissible fade show';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        `;
        const container = document.querySelector('.container') || document.body;
        container.insertBefore(alertDiv, container.firstChild);
    },
    
    async loadLocalData() {
        try {
            const response = await fetch('/api/data/local-data');
            const result = await response.json();
            
            if (result.success) {
                this.state.currentData = result.data;
                this.displayData(result.data);
                this.updateFilters(result.data);
            } else {
                this.showError('加载数据失败: ' + result.error);
            }
        } catch (error) {
            this.showError('加载数据失败: ' + error.message);
        }
    },
    
    displayData(data) {
        const tbody = document.getElementById('dataTable');
        tbody.innerHTML = '';
        
        const filteredData = this.filterData(data);
        
        if (filteredData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">暂无数据</td></tr>';
            return;
        }
        
        const escapeHtml = (text) => {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        };
        
        filteredData.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${escapeHtml(item.exchange.toUpperCase())}</td>
                <td>${escapeHtml(item.symbol)}</td>
                <td>${escapeHtml(item.timeframe)}</td>
                <td>${escapeHtml(item.data_type || 'unknown')}</td>
                <td>${escapeHtml(item.date_range.start)} 到 ${escapeHtml(item.date_range.end)}</td>
                <td>${item.data_points.toLocaleString()}</td>
                <td>${escapeHtml(item.file_size)}</td>
                <td>${escapeHtml(item.last_modified)}</td>
                <td></td>
            `;
            
            const actionsCell = row.querySelector('td:last-child');
            
            const viewBtn = document.createElement('button');
            viewBtn.className = 'btn btn-sm btn-outline-primary';
            viewBtn.innerHTML = '👁️ 查看';
            viewBtn.dataset.filePath = item.file_path;
            viewBtn.addEventListener('click', function() {
                viewData(this.dataset.filePath);
            });
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn btn-sm btn-outline-danger';
            deleteBtn.innerHTML = '🗑️ 删除';
            deleteBtn.dataset.filePath = item.file_path;
            deleteBtn.addEventListener('click', function() {
                deleteData(this.dataset.filePath);
            });
            
            actionsCell.appendChild(viewBtn);
            actionsCell.appendChild(document.createTextNode(' '));
            actionsCell.appendChild(deleteBtn);
            
            tbody.appendChild(row);
        });
    },
    
    filterData(data) {
        const exchangeFilter = document.getElementById('filterExchange').value;
        const symbolFilter = document.getElementById('filterSymbol').value;
        const timeframeFilter = document.getElementById('filterTimeframe').value;
        const dataTypeFilter = document.getElementById('filterDataType').value;
        
        return data.filter(item => {
            const exchangeMatch = !exchangeFilter || item.exchange === exchangeFilter;
            const symbolMatch = !symbolFilter || item.symbol === symbolFilter;
            const timeframeMatch = !timeframeFilter || item.timeframe === timeframeFilter;
            const dataTypeMatch = !dataTypeFilter || (item.data_type || 'unknown') === dataTypeFilter;
            
            return exchangeMatch && symbolMatch && timeframeMatch && dataTypeMatch;
        });
    },
    
    updateFilters(data) {
        const exchanges = [...new Set(data.map(item => item.exchange))];
        const symbols = [...new Set(data.map(item => item.symbol))];
        const timeframes = [...new Set(data.map(item => item.timeframe))];
        const dataTypes = [...new Set(data.map(item => item.data_type || 'unknown'))];
        
        const updateSelect = (id, values) => {
            const select = document.getElementById(id);
            const currentValue = select.value;
            select.innerHTML = '<option value="">全部</option>';
            values.forEach(val => {
                const option = document.createElement('option');
                option.value = val;
                option.textContent = id === 'filterExchange' ? val.toUpperCase() : val;
                select.appendChild(option);
            });
            if (values.includes(currentValue)) {
                select.value = currentValue;
            }
        };
        
        updateSelect('filterExchange', exchanges);
        updateSelect('filterSymbol', symbols);
        updateSelect('filterTimeframe', timeframes);
        updateSelect('filterDataType', dataTypes);
    },
    
    async loadAvailableFactors() {
        try {
            const response = await fetch('/api/factors/list');
            const result = await response.json();
            
            if (result.success) {
                this.state.availableFactors = result.factors || [];
                this.updateFactorSelect();
            }
        } catch (error) {
            console.error('加载因子列表失败:', error);
        }
    },
    
    updateFactorSelect() {
        const factorSelect = document.getElementById('factorSelect');
        if (!factorSelect) return;
        
        factorSelect.innerHTML = '<option value="">选择因子...</option>';
        this.state.availableFactors.forEach(factor => {
            const option = document.createElement('option');
            option.value = factor.id;
            option.textContent = `${factor.name} (${factor.type || '未知类型'})`;
            factorSelect.appendChild(option);
        });
    }
};

function handlePlotlyError() {
    const backupScript = document.createElement('script');
    backupScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.1/plotly.min.js';
    backupScript.onload = () => DataViewer.state.plotlyLoaded = true;
    backupScript.onerror = () => {
        DataViewer.showError('图表库加载失败，K线图功能不可用');
    };
    document.head.appendChild(backupScript);
}

document.addEventListener('DOMContentLoaded', function() {
    DataViewer.init();
});

function addFactor() {
    const factorSelect = document.getElementById('factorSelect');
    const factorId = factorSelect.value;
    
    if (!factorId) {
        alert('请先选择一个因子');
        return;
    }
    
    if (DataViewer.state.selectedFactors.find(f => f.id === factorId)) {
        alert('该因子已经添加过了');
        return;
    }
    
    const factor = DataViewer.state.availableFactors.find(f => f.id === factorId);
    if (!factor) {
        alert('找不到因子信息');
        return;
    }
    
    DataViewer.state.selectedFactors.push({
        id: factorId,
        name: factor.name,
        type: factor.type || '未知类型'
    });
    
    updateSelectedFactorsUI();
    
    if (DataViewer.state.currentOHLCVData) {
        renderKlineChart(DataViewer.state.currentOHLCVData);
    }
    
    factorSelect.value = '';
}

function removeFactor(factorId) {
    DataViewer.state.selectedFactors = DataViewer.state.selectedFactors.filter(f => f.id !== factorId);
    updateSelectedFactorsUI();
    
    if (DataViewer.state.currentOHLCVData) {
        renderKlineChart(DataViewer.state.currentOHLCVData);
    }
}

function clearFactors() {
    DataViewer.state.selectedFactors = [];
    DataViewer.state.factorCache = {};
    updateSelectedFactorsUI();
    
    if (DataViewer.state.currentOHLCVData) {
        renderKlineChart(DataViewer.state.currentOHLCVData);
    }
}

function updateSelectedFactorsUI() {
    const selectedFactorsRow = document.getElementById('selectedFactorsRow');
    const selectedFactorsList = document.getElementById('selectedFactorsList');
    
    if (!selectedFactorsRow || !selectedFactorsList) return;
    
    if (DataViewer.state.selectedFactors.length === 0) {
        selectedFactorsRow.style.display = 'none';
        return;
    }
    
    selectedFactorsRow.style.display = 'block';
    selectedFactorsList.innerHTML = '';
    
    DataViewer.state.selectedFactors.forEach(factor => {
        const factorTag = document.createElement('span');
        factorTag.className = 'badge bg-primary me-2 mb-1';
        factorTag.innerHTML = `
            ${factor.name}
            <button type="button" class="btn-close btn-close-white ms-2" 
                    onclick="removeFactor('${factor.id}')" 
                    style="font-size: 0.5rem;"></button>
        `;
        selectedFactorsList.appendChild(factorTag);
    });
}

function refreshData() {
    DataViewer.loadLocalData();
}

function viewData(filePath) {
    const modal = new bootstrap.Modal(document.getElementById('dataViewModal'));
    modal.show();
    
    document.getElementById('dataViewModalLabel').textContent = '📊 数据查看 - 加载中...';
    
    loadDataForView(filePath);
}

async function loadDataForView(filePath) {
    try {
        const response = await fetch('/api/data/view-data', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ file_path: filePath })
        });
        
        const result = await response.json();
        
        if (result.success) {
            document.getElementById('dataViewModalLabel').textContent = `📊 数据查看 - ${result.data.symbol} ${result.data.timeframe}`;
            displayDataInModal(result.data);
        } else {
            const klineChart = document.getElementById('klineChart');
            if (klineChart) {
                klineChart.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>❌ 加载失败</h6>
                        <p>${result.error}</p>
                    </div>
                `;
            }
        }
    } catch (error) {
        const klineChart = document.getElementById('klineChart');
        if (klineChart) {
            klineChart.innerHTML = `
                <div class="alert alert-danger">
                    <h6>❌ 加载失败</h6>
                    <p>${error.message}</p>
                </div>
            `;
        }
    }
}

function displayDataInModal(data) {
    renderKlineChart(data.ohlcv_data);
    renderDataTable(data.ohlcv_data);
    renderMetaInfo(data);
}

async function renderKlineChart(ohlcvData) {
    if (!ohlcvData || !Array.isArray(ohlcvData) || ohlcvData.length === 0) {
        return;
    }
    
    DataViewer.state.currentOHLCVData = ohlcvData;
    
    const chartContainer = document.getElementById('klineChart');
    if (!chartContainer) return;
    
    if (typeof Plotly === 'undefined') return;
    
    const validIndices = [];
    for (let i = 0; i < ohlcvData.length; i++) {
        const item = ohlcvData[i];
        if (item.open !== null && item.high !== null && 
            item.low !== null && item.close !== null) {
            validIndices.push(i);
        }
    }
    
    if (validIndices.length === 0) return;
    
    const times = validIndices.map(i => ohlcvData[i].timestamp);
    const opens = validIndices.map(i => ohlcvData[i].open);
    const highs = validIndices.map(i => ohlcvData[i].high);
    const lows = validIndices.map(i => ohlcvData[i].low);
    const closes = validIndices.map(i => ohlcvData[i].close);
    const volumes = validIndices.map(i => ohlcvData[i].volume);
    
    const candlestickData = [{
        type: 'candlestick',
        x: times,
        open: opens,
        high: highs,
        low: lows,
        close: closes,
        name: 'K线图',
        increasing: {
            line: { color: '#26a69a' },
            fillcolor: '#26a69a'
        },
        decreasing: {
            line: { color: '#ef5350' },
            fillcolor: '#ef5350'
        }
    }];
    
    const volumeColors = closes.map((close, i) => close >= opens[i] ? 'rgba(38,166,154,0.7)' : 'rgba(239,83,80,0.7)');
    
    const volumeData = [{
        type: 'bar',
        x: times,
        y: volumes,
        name: '成交量',
        yaxis: 'y2',
        marker: { color: volumeColors },
        opacity: 0.8
    }];
    
    const factorData = await prepareFactorData(ohlcvData, times);
    
    const allData = [...candlestickData, ...volumeData, ...factorData];
    
    const layout = {
        title: {
            text: 'K线图 (UTC时间)',
            font: { size: 16 }
        },
        xaxis: {
            title: '时间 (UTC)',
            type: 'date',
            rangeslider: { visible: false }
        },
        yaxis: {
            title: '价格',
            side: 'left',
            domain: [0.4, 1]
        },
        yaxis2: {
            title: '成交量',
            side: 'left',
            domain: [0.2, 0.35],
            overlaying: false
        },
        yaxis3: {
            title: '因子值',
            side: 'right',
            domain: [0.4, 1],
            overlaying: 'y',
            anchor: 'x',
            position: 1
        },
        height: null,
        width: null,
        margin: { l: 40, r: 60, t: 40, b: 40 },
        showlegend: true,
        legend: { x: 0, y: 1 },
        autosize: true,
        fitToContainer: true
    };
    
    try {
        if (DataViewer.state.klineChartEl) {
            Plotly.purge(DataViewer.state.klineChartEl);
        }
        
        if (DataViewer.state.resizeHandler) {
            window.removeEventListener('resize', DataViewer.state.resizeHandler);
        }
        
        Plotly.newPlot(chartContainer, allData, layout, {
            responsive: true,
            displayModeBar: true,
            modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d'],
            useResizeHandler: true,
            autosize: true
        });
        
        DataViewer.state.resizeHandler = function() {
            Plotly.Plots.resize(chartContainer);
        };
        window.addEventListener('resize', DataViewer.state.resizeHandler);
        
        setTimeout(function() {
            Plotly.Plots.resize(chartContainer);
        }, 100);
        
        DataViewer.state.klineChartEl = chartContainer;
        
    } catch (error) {
        chartContainer.innerHTML = `
            <div class="alert alert-danger">
                <h6>❌ K线图创建失败</h6>
                <p>${error.message}</p>
            </div>
        `;
    }
}

async function prepareFactorData(ohlcvData, times) {
    if (!DataViewer.state.selectedFactors || DataViewer.state.selectedFactors.length === 0) {
        return [];
    }
    
    const factorData = [];
    const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F'];
    
    for (let i = 0; i < DataViewer.state.selectedFactors.length; i++) {
        const factor = DataViewer.state.selectedFactors[i];
        const color = colors[i % colors.length];
        
        try {
            const cacheKey = factor.id;
            let factorValues;
            
            if (DataViewer.state.factorCache[cacheKey]) {
                factorValues = DataViewer.state.factorCache[cacheKey];
            } else {
                factorValues = await calculateFactor(factor.id, ohlcvData);
                if (factorValues) {
                    DataViewer.state.factorCache[cacheKey] = factorValues;
                }
            }
            
            if (factorValues && factorValues.length > 0) {
                const factorTrace = {
                    type: 'scatter',
                    mode: 'lines',
                    x: times,
                    y: factorValues,
                    name: factor.name,
                    line: {
                        color: color,
                        width: 2
                    },
                    opacity: 0.8,
                    yaxis: 'y3',
                    showlegend: true
                };
                
                factorData.push(factorTrace);
            }
        } catch (error) {
            console.error(`计算因子 ${factor.name} 失败:`, error);
        }
    }
    
    return factorData;
}

async function calculateFactor(factorId, ohlcvData) {
    try {
        const marketData = {
            open: ohlcvData.map(item => item.open),
            high: ohlcvData.map(item => item.high),
            low: ohlcvData.map(item => item.low),
            close: ohlcvData.map(item => item.close),
            volume: ohlcvData.map(item => item.volume)
        };
        
        const response = await fetch('/api/factors/calculate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                factor_id: factorId,
                data: marketData,
                parameters: {}
            })
        });
        
        const result = await response.json();
        
        if (result.success) {
            return result.factor_values;
        } else {
            console.error(`因子 ${factorId} 计算失败:`, result.error);
            return null;
        }
    } catch (error) {
        console.error(`计算因子 ${factorId} 时出错:`, error);
        return null;
    }
}

function renderDataTable(ohlcvData) {
    const tbody = document.getElementById('dataTableBody');
    if (!tbody) return;
    
    tbody.innerHTML = '';
    
    if (!ohlcvData || !Array.isArray(ohlcvData) || ohlcvData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无数据</td></tr>';
        return;
    }
    
    const displayData = ohlcvData.slice(0, 100);
    
    displayData.forEach(item => {
        const row = document.createElement('tr');
        
        try {
            const timestamp = item.timestamp ? new Date(item.timestamp).toLocaleString() : 'N/A';
            const open = (typeof item.open === 'number' && !isNaN(item.open)) ? item.open.toFixed(4) : 'N/A';
            const high = (typeof item.high === 'number' && !isNaN(item.high)) ? item.high.toFixed(4) : 'N/A';
            const low = (typeof item.low === 'number' && !isNaN(item.low)) ? item.low.toFixed(4) : 'N/A';
            const close = (typeof item.close === 'number' && !isNaN(item.close)) ? item.close.toFixed(4) : 'N/A';
            const volume = (typeof item.volume === 'number' && !isNaN(item.volume)) ? item.volume.toLocaleString() : 'N/A';
            
            row.innerHTML = `
                <td>${timestamp}</td>
                <td>${open}</td>
                <td>${high}</td>
                <td>${low}</td>
                <td>${close}</td>
                <td>${volume}</td>
            `;
        } catch (error) {
            row.innerHTML = '<td colspan="6" class="text-center text-danger">数据格式错误</td>';
        }
        
        tbody.appendChild(row);
    });
    
    if (ohlcvData.length > 100) {
        const infoRow = document.createElement('tr');
        infoRow.innerHTML = `
            <td colspan="6" class="text-center text-muted">
                显示前100条数据，共${ohlcvData.length}条
            </td>
        `;
        tbody.appendChild(infoRow);
    }
}

function _safeArrayStats(arr) {
    if (!arr || arr.length === 0) return { min: 0, max: 0, avg: 0 };
    let min = arr[0], max = arr[0], sum = 0;
    for (let i = 0; i < arr.length; i++) {
        const v = arr[i];
        if (v < min) min = v;
        if (v > max) max = v;
        sum += v;
    }
    return { min, max, avg: sum / arr.length };
}

function renderMetaInfo(data) {
    const metaInfo = document.getElementById('metaInfo');
    if (!metaInfo) return;
    
    const ohlcvData = data.ohlcv_data;
    if (!ohlcvData || !Array.isArray(ohlcvData) || ohlcvData.length === 0) {
        metaInfo.innerHTML = '<p class="text-muted">暂无数据</p>';
        return;
    }
    
    const prices = ohlcvData.map(item => item.close).filter(p => p !== null && !isNaN(p) && typeof p === 'number');
    const volumes = ohlcvData.map(item => item.volume).filter(v => v !== null && !isNaN(v) && typeof v === 'number');
    
    if (prices.length === 0 || volumes.length === 0) {
        metaInfo.innerHTML = '<p class="text-muted">数据不完整，无法计算统计信息</p>';
        return;
    }
    
    const priceStats = _safeArrayStats(prices);
    const volumeStats = _safeArrayStats(volumes);
    
    const priceVolatility = priceStats.avg > 0 ? ((priceStats.max - priceStats.min) / priceStats.avg * 100).toFixed(2) : 'N/A';
    
    metaInfo.innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6>📊 基本信息</h6>
                <ul class="list-unstyled">
                    <li><strong>交易对:</strong> ${data.symbol}</li>
                    <li><strong>时间框架:</strong> ${data.timeframe}</li>
                    <li><strong>数据点数:</strong> ${ohlcvData.length.toLocaleString()}</li>
                    <li><strong>时间范围:</strong> ${ohlcvData[0].timestamp ? new Date(ohlcvData[0].timestamp).toLocaleDateString() : 'N/A'} 到 ${ohlcvData[ohlcvData.length-1].timestamp ? new Date(ohlcvData[ohlcvData.length-1].timestamp).toLocaleDateString() : 'N/A'}</li>
                </ul>
            </div>
            <div class="col-md-6">
                <h6>💰 价格统计</h6>
                <ul class="list-unstyled">
                    <li><strong>最低价:</strong> ${priceStats.min.toFixed(4)}</li>
                    <li><strong>最高价:</strong> ${priceStats.max.toFixed(4)}</li>
                    <li><strong>平均价:</strong> ${priceStats.avg.toFixed(4)}</li>
                    <li><strong>价格波动:</strong> ${priceVolatility}%</li>
                </ul>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <h6>📈 成交量统计</h6>
                <ul class="list-unstyled">
                    <li><strong>最小成交量:</strong> ${volumeStats.min.toLocaleString()}</li>
                    <li><strong>最大成交量:</strong> ${volumeStats.max.toLocaleString()}</li>
                    <li><strong>平均成交量:</strong> ${volumeStats.avg.toLocaleString()}</li>
                </ul>
            </div>
            <div class="col-md-6">
                <h6>🔍 数据质量</h6>
                <ul class="list-unstyled">
                    <li><strong>完整度:</strong> ${((ohlcvData.filter(item => item.open && item.high && item.low && item.close && item.volume).length / ohlcvData.length) * 100).toFixed(1)}%</li>
                    <li><strong>文件大小:</strong> ${data.file_size || 'N/A'}</li>
                    <li><strong>最后更新:</strong> ${data.last_modified || 'N/A'}</li>
                </ul>
            </div>
        </div>
    `;
}

function exportData(format) {
    const ohlcvData = DataViewer.state.currentOHLCVData;
    if (!ohlcvData || ohlcvData.length === 0) {
        alert('没有可导出的数据');
        return;
    }
    
    const headers = ['时间', '开盘价', '最高价', '最低价', '收盘价', '成交量'];
    const rows = ohlcvData.map(item => [
        item.timestamp || '',
        item.open || '',
        item.high || '',
        item.low || '',
        item.close || '',
        item.volume || ''
    ]);
    
    if (format === 'csv') {
        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `ohlcv_data_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
    }
}

function deleteData(filePath) {
    if (confirm(`确定要删除这个数据文件吗？\n${filePath}`)) {
        fetch('/api/data/delete-data', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ file_path: filePath })
        })
        .then(response => response.json())
        .then(result => {
            if (result.success) {
                alert('数据删除成功');
                DataViewer.loadLocalData();
            } else {
                alert('删除失败: ' + result.error);
            }
        })
        .catch(error => {
            alert('删除失败: ' + error.message);
        });
    }
}
